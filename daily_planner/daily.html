<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데일리 플래너</title>
    <link rel="stylesheet" href="daily_style.css">
</head>

<body>
    <div class="daily-wrapper">
        <div class="daily-header">
            <div class="titles">
                <span class="eyebrow">DAILY PLANNER</span>
                <span class="day-title" id="day-title">WEEK nn</span>
            </div>

            <div class="mood-container">
                <span class="eyebrow eyebrow-right">DAILY MOOD</span>
                <div id="mood-circles" class="mood-circles"></div>
            </div>
        </div>

        <!-- JS가 이 안에 월~목(4블럭) 또는 금~일(3블럭)을 동적으로 생성해 넣습니다 -->
        <div class="daily-stage" id="daily-stage"></div>

    </div>

    <script src="daily_script.js"></script>
</body>


</html>
