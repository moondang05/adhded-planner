<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레트로 포스터 달력</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase 구버전 호환 라이브러리 추가 -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <div class="calendar-wrapper">
        <!-- 달력 헤더 -->
        <div class="cal-header">
            <div class="cal-month" id="month-display"></div>
            <div class="monthly-goal">
                <div class="monthly-goal-title">- 자기 주의적 이기심(p)</div>
                <div class="monthly-goal-body">
                    <div class="monthly-quote" id="monthly-quote"></div>
                    <div class="quote-row"></div>
                    <div class="quote-row"></div>
                    <div class="quote-row"></div>
                </div>
            </div>
            <div class="cal-year-info">
                <div class="cal-month-num" id="month-num-display"></div>
                <div class="cal-year" id="year-display"></div>
            </div>
        </div>

        <div class="calendar-content">
            <!-- 달력 본문 (그리드) -->
            <div class="cal-grid" id="calendar-grid">
                <!-- JS로 요일과 날짜가 채워집니다 -->
            </div>

            <aside class="todo-panel" aria-label="Monthly To do list">
                <div class="todo-title">Monthly To do</div>
                <div class="todo-rows">
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                    <div class="todo-row"></div>
                </div>
            </aside>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
