<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>위클리 플래너</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="weekly-wrapper">
		<header class="weekly-header">
			<div>
				<p class="eyebrow">WEEKLY PLANNER</p>
				<h1 id="week-title"></h1>
			</div>
			<div class="month-gauge" id="month-gauge" aria-label="Month progress">
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-segment"></div>
				<div class="gauge-marker" aria-hidden="true">
					<div class="gauge-marker-inner"></div>
				</div>
				<div class="gauge-scale" aria-hidden="true">
					<span class="gauge-scale-start">0</span>
					<span class="gauge-scale-current">8</span>
					<span class="gauge-scale-end">12</span>
				</div>
			</div>
			
			<div class="week-info">
				<span id="week-range"></span>
				<span class="week-number" id="week-number"></span>
			</div>
		</header>

		<section class="weekly-stage" id="weekly-stage">
			<aside class="weekly-todo" aria-label="Weekly to do list">
				<div class="weekly-todo-title">할 일 목록</div>
				<div class="weekly-todo-rows">
					<div class="weekly-todo-row"><span>01</span></div>
					<div class="weekly-todo-row"><span>02</span></div>
					<div class="weekly-todo-row"><span>03</span></div>
					<div class="weekly-todo-row"><span>04</span></div>
					<div class="weekly-todo-row"><span>05</span></div>
					<div class="weekly-todo-row"><span>06</span></div>
					<div class="weekly-todo-row"><span>07</span></div>
					<div class="weekly-todo-row"><span>08</span></div>
					<div class="weekly-todo-row"><span>09</span></div>
					<div class="weekly-todo-row"><span>10</span></div>
					<div class="weekly-todo-row"><span>11</span></div>
					<div class="weekly-todo-row"><span>12</span></div>
					<div class="weekly-todo-row"><span>13</span></div>
					<div class="weekly-todo-row"><span>14</span></div>
					<div class="weekly-todo-row"><span>15</span></div>
					<div class="weekly-todo-row"><span>16</span></div>
					<div class="weekly-todo-row"><span>17</span></div>
				</div>
			</aside>
			<div class="weekly-grid-stack">
				<div class="weekly-grid" id="weekly-grid" aria-label="Weekly schedule"></div>
				<div class="weekly-bottom-box" aria-label="Weekly notes">
					<div class="weekly-bottom-row">
						<div class="weekly-bottom-prefix">수면 | 실제 - 계획</div><div class="weekly-bottom-columns"><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div></div>
					</div>
					<div class="weekly-bottom-row">
						<div class="weekly-bottom-prefix">분류 | 실제 - 계획</div><div class="weekly-bottom-columns"><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div></div>
					</div>
					<div class="weekly-bottom-row">
						<div class="weekly-bottom-prefix">분류 | 실제 - 계획</div><div class="weekly-bottom-columns"><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div></div>
					</div>
					<div class="weekly-bottom-row">
						<div class="weekly-bottom-prefix">분류 | 실제 - 계획</div><div class="weekly-bottom-columns"><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div><div class="weekly-bottom-cell"></div></div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="script.js"></script>
</body>

</html>
